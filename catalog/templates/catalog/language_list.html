{% extends "base_generic.html" %}

{% block content %}
<h1>Все языки</h1>
<ul>
    {% for language in language_list %}
    <li>
        {{ language.name }}
        {% if perms.catalog.can_mark_returned %}
            | <a href="{% url 'language_update' language.id %}">Редактировать</a>
            | <a href="{% url 'language_delete' language.id %}">Удалить</a>
        {% endif %}
    </li>
    {% endfor %}
</ul>
{% endblock %}
