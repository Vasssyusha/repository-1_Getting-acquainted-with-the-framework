{% extends "base_generic.html" %}

{% block content %}
<h1>Все жанры</h1>
<ul>
    {% for genre in genre_list %}
    <li>
        {{ genre.name }}
        {% if perms.catalog.can_mark_returned %}
            | <a href="{% url 'genre_update' genre.id %}">Редактировать</a>
            | <a href="{% url 'genre_delete' genre.id %}">Удалить</a>
        {% endif %}
    </li>
    {% endfor %}
</ul>
{% endblock %}
